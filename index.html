<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tulip Garden for You</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌷</text></svg>">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: #000000; 
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* UI Overlay */
        .ui-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; 
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        .hero-text {
            text-align: center;
            color: rgba(255, 255, 255, 0.8);
            margin-bottom: 40px;
            transition: opacity 0.5s ease;
        }

        .hero-text h1 {
            font-size: 32px;
            color: #ff7eb3;
            font-weight: 500;
            margin: 10px 0;
            text-shadow: 0 0 15px rgba(255, 126, 179, 0.6);
        }

        .hero-text p {
            font-size: 15px;
            color: #aaaaaa;
        }

        .top-left-text {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #ffffff;
            font-size: 14px;
            font-weight: bold;
            letter-spacing: 0.5px;
        }

        /* Buttons Container */
        .controls {
            position: absolute;
            bottom: 40px;
            display: flex;
            gap: 15px;
            pointer-events: auto; 
        }

        button {
            border: none;
            padding: 12px 24px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, opacity 0.2s, box-shadow 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        button:active {
            transform: scale(0.95);
        }

        .btn-clear {
            background-color: rgba(255, 255, 255, 0.15);
            color: #ddd;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255,255,255,0.2);
        }

        .btn-auto {
            background: linear-gradient(135deg, #ff758c 0%, #ff7eb3 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(255, 126, 179, 0.4);
        }

        .btn-auto.active {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            box-shadow: 0 4px 15px rgba(0, 242, 254, 0.4);
        }
    </style>
</head>
<body>

    <div class="top-left-text">Flower Garden for You</div>

    <div class="ui-container" id="ui-overlay">
        <div class="hero-text" id="hero-text">
            <p>Click Anywhere to</p>
            <h1>Plant Flowers</h1>
            <p>✨ or turn on Auto Bloom</p>
        </div>

        <div class="controls">
            <button class="btn-clear" id="btn-clear">🧹 Clear Garden</button>
            <button class="btn-auto" id="btn-auto">✨ Auto Bloom</button>
        </div>
    </div>

    <canvas id="garden"></canvas>

    <script>
        const canvas = document.getElementById('garden');
        const ctx = canvas.getContext('2d');
        const heroText = document.getElementById('hero-text');
        const btnAuto = document.getElementById('btn-auto');
        const btnClear = document.getElementById('btn-clear');

        let width, height;
        let flowers = [];
        let autoBloomActive = false;
        let autoBloomInterval;
        let gardenStarted = false;

        const tulipColors = [
            '#ff3366', // Deep Pink/Red
            '#ff7eb3', // Soft Pink
            '#ffcc00', // Golden Yellow
            '#b366ff', // Purple
            '#0066ff', // NEW: Deep vibrant blue
            '#ffffff'  // Pure White
        ];

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
        }

        window.addEventListener('resize', resize);
        resize();

        // Standard Cubic Bezier function for true curves
        function getBezier(t, p0, p1, p2, p3) {
            const mt = 1 - t;
            return (mt * mt * mt * p0) + (3 * mt * mt * t * p1) + (3 * mt * t * t * p2) + (t * t * t * p3);
        }

        class Tulip {
            constructor(targetX, targetY, isShowcase = false) {
                this.targetX = targetX;
                this.targetY = targetY;
                
                // Wider start X for a more dramatic S-Curve
                this.startX = targetX + (Math.random() * 200 - 100);
                this.startY = height + 50; 
                
                this.color = tulipColors[Math.floor(Math.random() * tulipColors.length)];
                if (isShowcase) this.color = '#ff7eb3'; // Force pink for showcase

                this.growth = 0; 
                this.growthSpeed = 0.008 + Math.random() * 0.01;
                this.size = 0.6 + Math.random() * 0.5; 
                if (isShowcase) this.size *= 1.3; // Make showcase flowers slightly larger

                // Sweeping S-Curve Control Points
                this.cp1X = this.startX + (Math.random() * 200 - 100);
                this.cp1Y = this.startY - (this.startY - this.targetY) * 0.3;
                this.cp2X = this.targetX + (Math.random() * 200 - 100);
                this.cp2Y = this.targetY + (this.startY - this.targetY) * 0.6;

                // Butterflies tied to this flower
                this.butterflies = [
                    { angle: Math.random() * Math.PI * 2, radius: 40 * this.size, speed: 0.02, offset: Math.random() * 100 },
                    { angle: Math.random() * Math.PI * 2, radius: 55 * this.size, speed: -0.015, offset: Math.random() * 100 }
                ];
            }

            update() {
                if (this.growth < 1) {
                    this.growth += (1 - this.growth) * this.growthSpeed + 0.004;
                    if (this.growth > 0.99) this.growth = 1;
                }
            }

            // Draw leaf attached higher up on the curvy stem
            drawLeaf(attachT, side) {
                if (this.growth < attachT) return; // Wait until stem grows past attachment point
                
                let leafGrowth = (this.growth - attachT) / (1 - attachT) * 1.5;
                if (leafGrowth > 1) leafGrowth = 1;

                // Attach directly to the curved stem's exact coordinate
                let baseX = getBezier(attachT, this.startX, this.cp1X, this.cp2X, this.targetX);
                let baseY = getBezier(attachT, this.startY, this.cp1Y, this.cp2Y, this.targetY);

                const leafGrad = ctx.createLinearGradient(baseX, baseY, baseX + (20 * side), baseY - (100 * this.size));
                leafGrad.addColorStop(0, '#2e7d32');
                leafGrad.addColorStop(1, '#66bb6a');
                
                ctx.fillStyle = leafGrad;
                ctx.shadowBlur = 0; 

                ctx.beginPath();
                ctx.moveTo(baseX, baseY);
                
                // Outer edge
                ctx.bezierCurveTo(
                    baseX + (60 * side * this.size), baseY - (30 * leafGrowth * this.size),
                    baseX + (50 * side * this.size), baseY - (120 * leafGrowth * this.size),
                    baseX + (10 * side * this.size), baseY - (160 * leafGrowth * this.size) 
                );
                
                // Inner edge (hugging back to stem)
                ctx.bezierCurveTo(
                    baseX + (15 * side * this.size), baseY - (100 * leafGrowth * this.size),
                    baseX - (5 * side * this.size), baseY - (40 * leafGrowth * this.size),
                    baseX, baseY
                );
                ctx.fill();
            }

            draw() {
                const currentX = getBezier(this.growth, this.startX, this.cp1X, this.cp2X, this.targetX);
                const currentY = getBezier(this.growth, this.startY, this.cp1Y, this.cp2Y, this.targetY);

                // --- Draw Curvy Stem ---
                ctx.beginPath();
                ctx.moveTo(this.startX, this.startY);
                for (let t = 0; t <= this.growth; t += 0.05) {
                    let px = getBezier(t, this.startX, this.cp1X, this.cp2X, this.targetX);
                    let py = getBezier(t, this.startY, this.cp1Y, this.cp2Y, this.targetY);
                    ctx.lineTo(px, py);
                }
                ctx.lineTo(currentX, currentY); 
                
                ctx.strokeStyle = '#689f38'; 
                ctx.lineWidth = 2.5 * this.size; 
                ctx.lineCap = 'round';
                ctx.shadowBlur = 3;
                ctx.shadowColor = '#33691e';
                ctx.stroke();

                // --- Draw Leaves ---
                this.drawLeaf(0.3, -1);
                this.drawLeaf(0.45, 1);

                // --- Draw Perfect Tulip Head ---
                if (this.growth > 0.8) {
                    const bloom = (this.growth - 0.8) * 8; 
                    
                    ctx.save();
                    ctx.translate(currentX, currentY);
                    ctx.scale(bloom * this.size, bloom * this.size);
                    
                    const grad = ctx.createLinearGradient(0, 5, 0, -50);
                    grad.addColorStop(0, '#ffffff'); 
                    grad.addColorStop(0.4, this.color);
                    grad.addColorStop(1, this.color);

                    ctx.shadowBlur = 15;
                    ctx.shadowColor = this.color;

                    // Back Petals
                    ctx.globalAlpha = 0.8;
                    ctx.fillStyle = this.color;
                    
                    ctx.beginPath(); ctx.moveTo(0, 3);
                    ctx.bezierCurveTo(-25, -10, -20, -45, -10, -48);
                    ctx.bezierCurveTo(-5, -25, -5, -10, 0, 3); ctx.fill();

                    ctx.beginPath(); ctx.moveTo(0, 3);
                    ctx.bezierCurveTo(25, -10, 20, -45, 10, -48);
                    ctx.bezierCurveTo(5, -25, 5, -10, 0, 3); ctx.fill();

                    // Front Petal
                    ctx.globalAlpha = 1.0;
                    ctx.fillStyle = grad;
                    
                    ctx.beginPath(); ctx.moveTo(0, 5); 
                    ctx.bezierCurveTo(22, -10, 18, -40, 0, -55); 
                    ctx.bezierCurveTo(-18, -40, -22, -10, 0, 5); ctx.fill();

                    ctx.restore();
                }

                // --- Draw Animated Glowing Butterflies ---
                if (this.growth > 0.9) {
                    this.butterflies.forEach(b => {
                        b.angle += b.speed;
                        let bX = currentX + Math.cos(b.angle) * b.radius;
                        let bY = currentY - 20 * this.size + Math.sin(b.angle * 2) * 15; 
                        
                        let flap = Math.abs(Math.sin(Date.now() * 0.01 + b.offset));

                        ctx.save();
                        ctx.translate(bX, bY);
                        ctx.rotate(b.angle + (b.speed > 0 ? Math.PI/2 : -Math.PI/2)); 

                        ctx.shadowBlur = 10;
                        ctx.shadowColor = '#ffffff';
                        ctx.fillStyle = '#ffffff';
                        
                        ctx.beginPath();
                        ctx.ellipse(-3 * flap, 0, 4 * flap, 6, 0, 0, Math.PI * 2); 
                        ctx.ellipse(3 * flap, 0, 4 * flap, 6, 0, 0, Math.PI * 2);  
                        ctx.fill();
                        
                        ctx.restore();
                    });
                }
            }
        }

        function animate() {
            // THE FIX: Completely fill the canvas with solid black every single frame.
            // This prevents any residual green leaf colors from smearing and staining the background.
            ctx.fillStyle = '#000000'; 
            ctx.fillRect(0, 0, width, height);

            flowers.forEach(flower => {
                flower.update();
                flower.draw();
            });

            requestAnimationFrame(animate);
        }

        function spawnFlower(x, y) {
            if (!gardenStarted) {
                gardenStarted = true;
                heroText.style.opacity = '0'; 
            }
            flowers.push(new Tulip(x, y));
            
            if (flowers.length > 50) {
                flowers.shift(); 
            }
        }

        function initShowcase() {
            const w = window.innerWidth;
            const h = window.innerHeight;
            
            let mainPink = new Tulip(w - 120, h - 350, true);
            let subPink = new Tulip(w - 200, h - 250, true);
            subPink.size *= 0.7; 
            
            flowers.push(mainPink, subPink);
        }

        // --- Event Listeners ---
        window.addEventListener('pointerdown', (e) => {
            if (e.target.closest('.controls')) return;
            spawnFlower(e.clientX, e.clientY);
        });

        btnAuto.addEventListener('click', () => {
            autoBloomActive = !autoBloomActive;
            
            if (autoBloomActive) {
                btnAuto.classList.add('active');
                btnAuto.innerHTML = '⏸ Stop Auto';
                if (!gardenStarted) {
                    gardenStarted = true;
                    heroText.style.opacity = '0';
                }
                
                autoBloomInterval = setInterval(() => {
                    const randX = Math.random() * (width - 100) + 50;
                    const randY = Math.random() * (height - 200) + 100;
                    spawnFlower(randX, randY);
                }, 400); 

            } else {
                btnAuto.classList.remove('active');
                btnAuto.innerHTML = '✨ Auto Bloom';
                clearInterval(autoBloomInterval);
            }
        });

        btnClear.addEventListener('click', () => {
            flowers = [];
            
            if (autoBloomActive) btnAuto.click();
            
            gardenStarted = false;
            heroText.style.opacity = '1';
            
            initShowcase(); 
        });

        initShowcase();
        animate();
    </script>
</body>
</html>
